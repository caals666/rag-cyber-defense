# Everything on your computer with one command:   docker compose up --build -d
#   website  http://localhost:3000     API  http://localhost:8000/docs     Neo4j  http://localhost:7474
#
# Start order: neo4j healthy -> neo4j-init loads the graph -> embed-init writes embeddings -> backend -> frontend.
# Settings come from .env (copy .env.example to .env and add your GROQ_API_KEY).

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # bolt, used by the code
    environment:
      NEO4J_AUTH: neo4j/${LOCAL_NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data
      - ./data/raw:/import:ro   # the 4 datasets, read by LOAD CSV
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${LOCAL_NEO4J_PASSWORD:-password123}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Loads the graph once. Skips loading if the graph already has nodes.
  neo4j-init:
    image: neo4j:5
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j:/scripts:ro
    environment:
      PW: ${LOCAL_NEO4J_PASSWORD:-password123}
    entrypoint: ["sh", "-c"]
    command:
      - |
        CS="cypher-shell -a bolt://neo4j:7687 -u neo4j -p $$PW"
        N=$$($$CS --format plain "MATCH (n) RETURN count(n)" | tail -n 1)
        if [ "$$N" = "0" ]; then
          for f in schema load_graph vector_index; do
            echo "running $$f.cypher" && $$CS -f /scripts/$$f.cypher || exit 1
          done
          echo "Graph loaded."
        else
          echo "Graph already has $$N nodes, skipping load."
        fi
    restart: "no"

  # Writes an embedding on every node (one time; nodes that already have one are skipped)
  embed-init:
    build: ./backend
    command: ["python", "/scripts/embed_nodes.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${LOCAL_NEO4J_PASSWORD:-password123}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      - ./neo4j:/scripts:ro
      - hf_cache:/root/.cache/huggingface   # model files kept between rebuilds
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${LOCAL_NEO4J_PASSWORD:-password123}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT-low}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      VECTOR_TOP_K: ${VECTOR_TOP_K:-5}
      VECTOR_MIN_SCORE: ${VECTOR_MIN_SCORE:-0.65}
      CORS_ORIGINS: http://localhost:3000,https://graphcyrag.vercel.app
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./tests:/app/tests:ro   # so the tests can run inside: docker compose exec backend python -m pytest tests -q
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Starts as soon as the graph is loaded; embed-init keeps embedding in the background (first run takes
    # several minutes on CPU). Until it finishes, questions without an ID use keyword search.
    depends_on:
      neo4j-init:
        condition: service_completed_successfully

  # Plain HTML/CSS/JS, served by nginx. API_URL is written into config.js when the container starts.
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  hf_cache:
